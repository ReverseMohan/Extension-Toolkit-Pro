<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=0.8">
  <title>Extension Toolkit Pro-Tempmial</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-content">
        <h1><i class="fas fa-envelope"></i> Temp-Mail</h1>
        <p>Temporary email service for OTP verification.</p>
 <!--     <p>Very useful service for tech lovers & for privacy. Lifetime free fore everyone!</p>
-->  
      </div>
    </header>

    <section class="create-section" id="createSection">
      <div class="section-header" id="sectionHeader">
        <h2><i class="fas fa-plus-circle"></i> Generate New Email</h2>
      </div>

      <div class="empty-state" id="emptyState">
        <div class="empty-icon">
          <i class="fas fa-envelope-circle-check"></i>
        </div>
        <h3>Create a Disposable/Temp Email</h3>
        <p>Generate a temporary email address to use for online 3rd party services & OTP verifiction!</p>
      </div>

      <div class="active-email" id="activeEmail" style="display:none;">
        <div class="email-info">
          <code id="emailAddress" class="email-address"></code>
          <div class="email-actions">
            <button id="copyBtn" class="btn btn-icon" title="Copy to clipboard">
              <i class="fas fa-copy"></i>
            </button>
            <button id="regenerateBtn" class="btn btn-icon" title="Regenerate email">
              <i class="fas fa-recycle"></i>
            </button>
          </div>
        </div>
      </div>

      <button id="createBtn" class="btn btn-primary btn-block">
        <i class="fas fa-magic"></i> Create Email Address
      </button>
      <div id="createResult" class="alert"></div>
            <div id="status" class="alert"></div><br>
    </section>

    <section class="inbox-section" id="inboxSection" style="display:none;">
      <div class="section-header">
        <h2><i class="fas fa-inbox"></i> Inbox</h2>
      </div>
      
      <div class="inbox-controls">
        <button id="refreshBtn" class="btn btn-primary btn-small">
          <i class="fas fa-sync-alt"></i> Refresh Messages
        </button>
      </div>
      
      <div id="messages" class="messages-container"></div>
    </section>

    <footer class="extension-footer">
      <p>Developed by <a style=" color: #ff0000;font-weight: 600;text-decoration: underline;" href="https://github.com/ReverseMohan" target="_blank">ReverseMohan</a></p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
